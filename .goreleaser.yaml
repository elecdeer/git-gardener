version: 2

project_name: git-gardener

builds:
  - id: gdn
    main: ./cmd/gdn
    binary: gdn
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  use: github-native

release:
  # 手動で作成済みのリリースがあれば、そのノートを残したままアセットだけ追加・置き換えする
  mode: keep-existing
  replace_existing_artifacts: true
