version: "2"

linters:
  # standard: errcheck, govet, ineffassign, staticcheck, unused
  default: standard
  enable:
    - errorlint
    - misspell
    - nolintlint
    - unconvert
    - usestdlibvars
    - usetesting
  settings:
    nolintlint:
      # 抑制コメントには理由を必須にし、不要になった抑制も検出する
      require-explanation: true
      require-specific: true

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      # 自モジュールの import を標準・外部パッケージとは別グループにする
      local-prefixes:
        - github.com/elecdeer/git-gardener
